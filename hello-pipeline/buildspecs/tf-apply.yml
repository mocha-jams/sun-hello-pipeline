version: 0.2
env:
  variables:
    TF_IN_AUTOMATION: "1"
    TARGET_WS: "dev"
phases:
  install:
    commands:
      - curl -sLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
  build:
    commands:
      - cd infra
      - terraform init -input=false
      - terraform workspace select $TARGET_WS || terraform workspace new $TARGET_WS
      - terraform apply -auto-approve -input=false -var "env=$TARGET_WS"