version: 0.2
phases:
  build:
    commands:
      - echo "Testing API endpoint..."
      - API_URL=$(aws ssm get-parameter --name "/hello-pipeline/dev/api-url" --with-decryption --query "Parameter.Value" --output text || echo "")
      - test -n "$API_URL" || { echo "No API URL found in SSM"; exit 1; }
      - echo "GET $API_URL"
      - curl -sSf $API_URL | tee output.json
      - grep -q '"ok": true' output.json
artifacts:
  files:
    - output.json