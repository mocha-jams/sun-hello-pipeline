version: 0.2

phases:
  install:
    commands:
      - curl -LO https://releases.hashicorp.com/terraform/1.5.0/terraform_1.5.0_linux_amd64.zip
      - unzip terraform_1.5.0_linux_amd64.zip -d /usr/local/bin/
  build:
    commands:
      - terraform init
      - terraform validate
      - terraform plan -out=tfplan
artifacts:
  files:
    - tfplan
